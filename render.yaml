services:
  - type: web
    name: nr-invite
    runtime: node
    plan: free

    buildCommand: npm install
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: TOKEN
        sync: false

      - key: CLIENT_ID
        sync: false

      - key: CLIENT_SECRET
        sync: false

      - key: DASHBOARD_URL
        sync: false

      - key: SUPPORT_SERVER
        value: "https://discord.gg/PZw45tHPfc"

      - key: SMTP_HOST
        value: "smtp.gmail.com"

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: PORT
        value: "3000"
